<table class="table table-warning">
  <thead>
    <tr>
      <th>Numero</th>
      <th>Nombre</th>
      <th>Localidad</th>
      <td></td>
    </tr>
  </thead>
  <tbody>
    @for (dept of departamentos; track dept) {
      <tr>
        <th>{{dept.numero}}</th>
        <td>{{dept.nombre}}</td>
        <td>{{dept.localidad}}</td>
        <td>
          <a [routerLink]="['/details/' + dept.numero + '/' + dept.nombre + '/' + dept.localidad]" class="btn btn-info">Detalles</a>
          <!--OTRA FORMA <a [routerLink]="['/details/', dept.numero, dept.nombre, dept.localidad]">Detalles</a> -->
          <a [routerLink]="['/update/' + dept.numero ]" class="btn btn-primary">Update</a>
          <button class="btn btn-danger" (click)="deleteDepartamento(dept.numero)">Delete</button>
        </td>
      </tr>
    }
  </tbody>
</table>
